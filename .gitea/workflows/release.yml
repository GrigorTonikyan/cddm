name: Gitea Release & Distribution Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_prefix: cddm-windows-amd64
            archive_ext: ".zip"
            exe_ext: ".exe"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_prefix: cddm-linux-amd64
            archive_ext: ".tar.gz"
            exe_ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_prefix: cddm-darwin-amd64
            archive_ext: ".tar.gz"
            exe_ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_prefix: cddm-darwin-arm64
            archive_ext: ".tar.gz"
            exe_ext: ""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build WebUI Distribution Assets
        working-directory: ./webui
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Standalone Binaries (CLI, MCP, LSP)
        run: |
          cargo build --release --target ${{ matrix.target }} --bin cddm --bin cddm-mcp --bin cddm-lsp

      - name: Package Target Archive
        shell: bash
        run: |
          mkdir -p dist-package
          cp target/${{ matrix.target }}/release/cddm${{ matrix.exe_ext }} dist-package/
          cp target/${{ matrix.target }}/release/cddm-mcp${{ matrix.exe_ext }} dist-package/
          cp target/${{ matrix.target }}/release/cddm-lsp${{ matrix.exe_ext }} dist-package/
          TAG_NAME="${GITHUB_REF_NAME:-v1.9.0}"
          if [ "${{ matrix.archive_ext }}" = ".zip" ]; then
            cd dist-package && zip -r "../cddm-${TAG_NAME}-${{ matrix.target }}.zip" ./* && cd ..
          else
            cd dist-package && tar -czvf "../cddm-${TAG_NAME}-${{ matrix.target }}.tar.gz" ./* && cd ..
          fi

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-archive
          path: cddm-*.*

  package-vscode:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build and Package Extension
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/package-vscode.ts

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: packaging/vscode/*.vsix

  gitea-publish:
    name: Publish Gitea Release & Ecosystem Packages
    needs: [build-binaries, package-vscode]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Collect Assets & Generate SHA256 Checksums
        run: |
          mkdir -p dist-release
          find ./downloaded-artifacts -type f -exec cp {} ./dist-release/ \;
          cd ./dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release to Gitea
        env:
          GITEA_HOST: "git.gt-web-dev.com"
          GITEA_REPO: "gt-dev/cddm"
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.9.0}"
          bun scripts/publish-release.ts --tag "${TAG_NAME}" --dist-dir "dist-release"
