name: Gitea Continuous Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  security-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Scan Repository Secrets
        uses: self:gt-dev/actions/gitleaks-scan@v1
        with:
          redact: "true"
          source: "."

  rust-build:
    name: Build Release Binaries & Strict Dogfooding
    runs-on: ubuntu-latest-12-cores
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true
        with:
          shared-key: "ci-release-bin"

      - name: Ensure Embedded WebUI Assets Placeholder
        run: |
          mkdir -p webui/dist
          test -f webui/dist/index.html || echo '<!DOCTYPE html><html><head><title>CDDM</title></head><body><div id="root"></div></body></html>' > webui/dist/index.html

      - name: Build Release Binaries (cddm, cddm-mcp, cddm-lsp)
        run: cargo build --release --locked -p cddm-cli --bin cddm -p cddm-mcp --bin cddm-mcp -p cddm-lsp --bin cddm-lsp

      - name: Verify Binary Execution & Version
        run: |
          ./target/release/cddm --version
          ./target/release/cddm-mcp --version
          ./target/release/cddm-lsp --version

      - name: CDDM Strict Dogfooding Quality Gate (<= 5.0% Fail Threshold)
        run: ./target/release/cddm scan . --min-tokens 50 --fail-threshold 5.0

      - name: Upload Prebuilt Release Binaries
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: cddm-prebuilt-binaries
          path: |
            target/release/cddm
            target/release/cddm-mcp
            target/release/cddm-lsp

  rust-ci:
    name: Rust Quality Gate (fmt, clippy, tests)
    runs-on: ubuntu-latest-12-cores
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true
        with:
          shared-key: "ci-rust-check"

      - name: Verify Rust Formatting (cargo fmt --check)
        run: cargo fmt --check

      - name: Ensure Embedded WebUI Assets Placeholder
        run: |
          mkdir -p webui/dist
          test -f webui/dist/index.html || echo '<!DOCTYPE html><html><head><title>CDDM</title></head><body><div id="root"></div></body></html>' > webui/dist/index.html

      - name: Clippy Zero-Warning Linter (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Unit & Integration Tests (cargo test)
        run: cargo test --workspace --locked

  workspace-governance-ci:
    name: Workspace Standards & Polyglot Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/setup-deps.ts

      - name: Validate Formatting, Lints & TypeScript (vp check)
        run: bunx vp check

      - name: Run Workspace Script Test Suites (bun test)
        run: bun test --timeout 60000 scripts/tests scripts/lib

      - name: Validate 4-Pillar Feature Parity
        run: bun scripts/check-feature-parity.ts

      - name: Validate File Length Limits (<= 500 lines)
        run: bun scripts/check-file-length.ts

      - name: Validate Zero-Emoji Policy
        run: bun scripts/check-no-emojis.ts

      - name: Validate Documentation Integrity & Synchronization
        run: bun scripts/check-docs.ts

      - name: Validate SSoT Workspace Version Synchronization
        run: bun scripts/version.ts --check

      - name: Validate PR Version Bump & Changelog Gate
        if: github.event_name == 'pull_request'
        run: bun scripts/version.ts --check-pr

      - name: Validate Rich Release Notes & MCP Standard
        run: bun scripts/check-release-notes.ts

  webui-ci:
    name: WebUI Frontend Suite & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui --frozen-lockfile || bun install --cwd webui

      - name: Run WebUI Vitest Suite (vitest run)
        working-directory: ./webui
        run: bun run test

      - name: Build WebUI Production Bundle (vp build)
        working-directory: ./webui
        run: bun run build

  mcp-ci:
    name: MCP Protocol Per-Tool Quality Gate
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Download Prebuilt Binaries
        uses: self:gt-dev/actions/download-artifact@v1
        with:
          name: cddm-prebuilt-binaries
          path: target/release

      - name: Ensure Binaries Executable
        run: chmod +x target/release/cddm target/release/cddm-mcp target/release/cddm-lsp

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run MCP Protocol Per-Tool Test Suites (bun test)
        run: bun test --timeout 60000 tests/mcp

  e2e-ci:
    name: Playwright E2E Browser Acceptance Gate
    needs: [rust-build]
    runs-on: ubuntu-latest
    container:
      image: git.gt-web-dev.com/gt-dev/playwright-runner:v1.65.0
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Download Prebuilt Binaries
        uses: self:gt-dev/actions/download-artifact@v1
        with:
          name: cddm-prebuilt-binaries
          path: target/release

      - name: Ensure Binaries Executable
        run: chmod +x target/release/cddm target/release/cddm-mcp target/release/cddm-lsp

      - name: Setup Enterprise Toolchains (Pre-Baked Fast Path)
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui --frozen-lockfile || bun install --cwd webui

      - name: Run Playwright E2E Browser Test Suite
        run: bun run test:e2e

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: playwright-test-artifacts
          path: |
            test-results/
            playwright-report/

  merge-gate:
    name: PR Quality & Merge Gate
    if: always()
    needs: [security-scan, rust-build, rust-ci, workspace-governance-ci, webui-ci, mcp-ci, e2e-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Upstream Quality Gates
        shell: bash
        env:
          SEC_RESULT: ${{ needs.security-scan.result }}
          BUILD_RESULT: ${{ needs.rust-build.result }}
          RUST_RESULT: ${{ needs.rust-ci.result }}
          GOV_RESULT: ${{ needs.workspace-governance-ci.result }}
          WEBUI_RESULT: ${{ needs.webui-ci.result }}
          MCP_RESULT: ${{ needs.mcp-ci.result }}
          E2E_RESULT: ${{ needs.e2e-ci.result }}
        run: |
          if [ "$SEC_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$RUST_RESULT" != "success" ] || \
             [ "$GOV_RESULT" != "success" ] || \
             [ "$WEBUI_RESULT" != "success" ] || \
             [ "$MCP_RESULT" != "success" ] || \
             [ "$E2E_RESULT" != "success" ]; then
            echo "[FAIL] One or more required PR quality gates did not succeed."
            exit 1
          fi
          echo "[PASS] All PR quality gates passed successfully."
