name: Renovate Automated Dependency & Digest Updates

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate Dependency & SHA Digest Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: self:gt-dev/actions/checkout@v1
        with:
          fetch-depth: 1

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"
          node: "true"

      - name: Validate Supply-Chain & Renovate Configuration
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/check-supply-chain.ts

      - name: Execute Self-Hosted Renovate on Gitea
        if: env.RENOVATE_TOKEN != ''
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: "${{ github.server_url }}/api/v1"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.RELEASE_BOT_TOKEN || secrets.GITEA_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_COM_TOKEN }}
        run: |
          npx --yes renovate
