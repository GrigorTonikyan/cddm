name: Gitea Release & Distribution Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: highperf
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_prefix: cddm-linux-amd64
            archive_ext: ".tar.gz"
            exe_ext: ""
          - target: x86_64-pc-windows-msvc
            artifact_prefix: cddm-windows-amd64
            archive_ext: ".zip"
            exe_ext: ".exe"

    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install System Dependencies
        run: |
          apt-get update || sudo apt-get update
          apt-get install -y zip tar curl || sudo apt-get install -y zip tar curl
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            apt-get install -y clang lld llvm nasm || sudo apt-get install -y clang lld llvm nasm
          fi

      - name: Build WebUI Distribution Assets
        working-directory: ./webui
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-xwin for Windows MSVC Cross-Compilation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          mkdir -p "${HOME}/.cargo/bin"
          XWIN_TAG=$(curl -fsSL https://api.github.com/repos/rust-cross/cargo-xwin/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -n "${XWIN_TAG}" ]; then
            curl -fsSL "https://github.com/rust-cross/cargo-xwin/releases/download/${XWIN_TAG}/cargo-xwin-${XWIN_TAG}.x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "${HOME}/.cargo/bin" || cargo install --locked cargo-xwin
          else
            cargo install --locked cargo-xwin
          fi
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo xwin --version

      - name: Build Standalone Binaries (CLI, MCP, LSP)
        shell: bash
        run: |
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            RUSTFLAGS="-C debuginfo=0 -C target-feature=+crt-static" \
              cargo xwin build --release --target ${{ matrix.target }} \
                -p cddm-cli --bin cddm \
                -p cddm-mcp --bin cddm-mcp \
                -p cddm-lsp --bin cddm-lsp
          else
            cargo build --release --target ${{ matrix.target }} \
              -p cddm-cli --bin cddm \
              -p cddm-mcp --bin cddm-mcp \
              -p cddm-lsp --bin cddm-lsp
          fi

      - name: Package Target Archive
        shell: bash
        run: |
          mkdir -p dist-package
          cp target/${{ matrix.target }}/release/cddm${{ matrix.exe_ext }} dist-package/
          cp target/${{ matrix.target }}/release/cddm-mcp${{ matrix.exe_ext }} dist-package/
          cp target/${{ matrix.target }}/release/cddm-lsp${{ matrix.exe_ext }} dist-package/
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v$(bun scripts/version.ts --get-current)"
          fi
          if [ "${{ matrix.archive_ext }}" = ".zip" ]; then
            cd dist-package && zip -r "../cddm-${TAG_NAME}-${{ matrix.target }}.zip" ./* && cd ..
          else
            cd dist-package && tar -czvf "../cddm-${TAG_NAME}-${{ matrix.target }}.tar.gz" ./* && cd ..
          fi

      - name: Upload Target Artifacts
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: ${{ matrix.artifact_prefix }}-archive
          path: cddm-*.*

  package-vscode:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Extension Dependencies
        working-directory: ./editors/vscode
        run: bun install

      - name: Build and Package Extension
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/package-vscode.ts

      - name: Upload VSIX Artifact
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: vscode-vsix
          path: packaging/vscode/*.vsix

  publish-container:
    name: Publish Container to Private VCS Registry
    runs-on: highperf
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Private Gitea Container Registry
        uses: self:gt-dev/actions/docker-login@v1
        with:
          registry: ${{ vars.GITEA_HOST || 'git.gt-web-dev.com' }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Release Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.GITEA_HOST || 'git.gt-web-dev.com' }}/${{ github.repository }}:latest
            ${{ vars.GITEA_HOST || 'git.gt-web-dev.com' }}/${{ github.repository }}:${{ github.ref_name }}

  publish-cargo:
    name: Publish Crates to Private Gitea Cargo Registry
    runs-on: highperf
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Publish Workspace Crates (cddm-core, cddm-lsp, cddm-mcp, cddm-cli)
        env:
          GITEA_HOST: ${{ vars.GITEA_HOST || 'git.gt-web-dev.com' }}
          CARGO_REGISTRY_OWNER: ${{ vars.PUBLISHER || github.repository_owner }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/publish-cargo.ts --registry gitea

  gitea-publish:
    name: Publish Gitea Release & Ecosystem Packages
    needs: [build-binaries, package-vscode, publish-container, publish-cargo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Download All Build Artifacts
        uses: self:gt-dev/actions/download-artifact@v1
        with:
          path: ./downloaded-artifacts

      - name: Collect Assets & Generate SHA256 Checksums
        run: |
          mkdir -p dist-release
          find ./downloaded-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.vsix" \) -exec cp {} ./dist-release/ \;
          cd ./dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release & Dispatch Package Manifests
        env:
          GITEA_HOST: ${{ vars.GITEA_HOST || 'git.gt-web-dev.com' }}
          GITEA_REPO: ${{ github.repository }}
          PACKAGE_PUBLISHER: ${{ vars.PUBLISHER || github.repository_owner }}
          PACKAGE_PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
          WINGET_REPO: ${{ vars.WINGET_REPO }}
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v$(bun scripts/version.ts --get-current)"
          fi
          bun scripts/publish-release.ts --tag "${TAG_NAME}" --dist-dir "dist-release" --dispatch-packages
