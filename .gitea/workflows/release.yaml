name: Gitea Release & Distribution Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-webui:
    name: Build Shared WebUI Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Build WebUI Distribution Assets
        working-directory: ./webui
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Upload Shared WebUI Dist
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: webui-dist
          path: webui/dist

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: [build-webui]
    runs-on: ubuntu-latest-12-cores
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_prefix: cddm-linux-amd64
            archive_ext: ".tar.gz"
            exe_ext: ""
          - target: x86_64-pc-windows-msvc
            artifact_prefix: cddm-windows-amd64
            archive_ext: ".zip"
            exe_ext: ".exe"

    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Download Shared WebUI Dist
        uses: self:gt-dev/actions/download-artifact@v1
        with:
          name: webui-dist
          path: webui/dist

      - name: Cache Windows Cross-Compile Tooling & CRT
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cache/cargo-xwin
            /var/cache/apt/archives
          key: ${{ runner.os }}-xwin-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-xwin-v1-

      - name: Install Windows Cross-Compilation Dependencies
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          MISSING=""
          for pkg_cmd in zip:zip clang:clang lld:lld llvm-lib:llvm nasm:nasm; do
            cmd_name="${pkg_cmd%%:*}"
            pkg_name="${pkg_cmd#*:}"
            if ! command -v "$cmd_name" >/dev/null 2>&1; then
              MISSING="${MISSING} ${pkg_name}"
            fi
          done

          if [ -z "${MISSING# }" ]; then
            echo "--> [FAST-PATH] All Windows cross-compilation tools already present; skipping apt-get."
            exit 0
          fi

          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          ${SUDO} sh -c 'echo "force-unsafe-io" > /etc/dpkg/dpkg.cfg.d/force-unsafe-io' || true
          ${SUDO} apt-get update -qq
          ${SUDO} apt-get install -y --no-install-recommends ${MISSING}
          ${SUDO} apt-get clean

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          targets: ${{ matrix.target }}

      - name: Rust Compilation Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Ensure cargo-xwin for Windows MSVC Cross-Compilation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo/bin"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            XWIN_TAG=$(curl -fsSL https://api.github.com/repos/rust-cross/cargo-xwin/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || true)
            if [ -n "${XWIN_TAG}" ]; then
              curl -fsSL "https://github.com/rust-cross/cargo-xwin/releases/download/${XWIN_TAG}/cargo-xwin-${XWIN_TAG}.x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "${HOME}/.cargo/bin" || cargo install --locked cargo-xwin
            else
              cargo install --locked cargo-xwin
            fi
          else
            echo "--> [FAST-PATH] Restored cached cargo-xwin binary."
          fi
          cargo xwin --version

      - name: Build Standalone Binaries (CLI, MCP, LSP)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if [ "${TARGET}" = "x86_64-pc-windows-msvc" ]; then
            RUSTFLAGS="-C debuginfo=0 -C target-feature=+crt-static" \
              cargo xwin build --release --locked --target "${TARGET}" \
                -p cddm-cli --bin cddm \
                -p cddm-mcp --bin cddm-mcp \
                -p cddm-lsp --bin cddm-lsp
          else
            cargo build --release --locked --target "${TARGET}" \
              -p cddm-cli --bin cddm \
              -p cddm-mcp --bin cddm-mcp \
              -p cddm-lsp --bin cddm-lsp
          fi

      - name: Package Target Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE_EXT: ${{ matrix.exe_ext }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p dist-package
          cp "target/${TARGET}/release/cddm${EXE_EXT}" dist-package/
          cp "target/${TARGET}/release/cddm-mcp${EXE_EXT}" dist-package/
          cp "target/${TARGET}/release/cddm-lsp${EXE_EXT}" dist-package/
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          fi
          if [ "${ARCHIVE_EXT}" = ".zip" ]; then
            (cd dist-package && zip -r "../cddm-${TAG_NAME}-${TARGET}.zip" ./*)
          else
            (cd dist-package && tar -czvf "../cddm-${TAG_NAME}-${TARGET}.tar.gz" ./*)
          fi

      - name: Upload Target Artifacts
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: ${{ matrix.artifact_prefix }}-archive
          path: cddm-*.*

  package-vscode:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Extension Dependencies
        working-directory: ./editors/vscode
        run: bun install

      - name: Build and Package Extension
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/package-vscode.ts

      - name: Upload VSIX Artifact
        uses: self:gt-dev/actions/upload-artifact@v1
        with:
          name: vscode-vsix
          path: packaging/vscode/*.vsix

  publish-container:
    name: Publish Container to Private VCS Registry
    runs-on: ubuntu-latest-12-cores
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Resolve Container Registry & Image Tags
        id: meta
        shell: bash
        env:
          GITEA_HOST_VAR: ${{ vars.GITEA_HOST }}
          REPO_FULL: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST_SOURCE="${GITEA_HOST_VAR:-${GITHUB_SERVER_URL:-}}"
          REGISTRY_HOST="${HOST_SOURCE#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          if [ -z "${REGISTRY_HOST}" ]; then
            echo "::error::Failed to resolve container registry hostname from vars.GITEA_HOST or GITHUB_SERVER_URL."
            exit 1
          fi
          IMAGE_BASE="${REGISTRY_HOST}/${REPO_FULL}"
          echo "registry=${REGISTRY_HOST}" >> "${GITHUB_OUTPUT}"
          echo "cache_ref=${IMAGE_BASE}:latest" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<EOF_TAGS"
            echo "${IMAGE_BASE}:latest"
            echo "${IMAGE_BASE}:${REF_NAME}"
            echo "${IMAGE_BASE}:sha-${COMMIT_SHA}"
            echo "EOF_TAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and Push Release Container (Native DinD BuildKit)
        uses: self:gt-dev/actions/docker-build-push@v1
        with:
          context: .
          file: ./Dockerfile
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ vars.PUBLISHER || github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          cache-mode: inline
          cache-ref: ${{ steps.meta.outputs.cache_ref }}

  publish-cargo:
    name: Publish Crates to Private Gitea Cargo Registry
    runs-on: ubuntu-latest-12-cores
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Rust Compilation Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true
        with:
          shared-key: "release-cargo"

      - name: Publish Workspace Crates (cddm-core, cddm-lsp, cddm-mcp, cddm-cli)
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          CARGO_REGISTRY_OWNER: ${{ vars.PUBLISHER || github.repository_owner }}
          CARGO_REGISTRIES_GITEA_INDEX: "sparse+${{ github.server_url }}/api/packages/${{ vars.PUBLISHER || github.repository_owner }}/cargo/"
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.RELEASE_BOT_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile || bun install
          bun scripts/publish-cargo.ts --registry gitea

  gitea-publish:
    name: Publish Gitea Release & Ecosystem Packages
    needs: [build-binaries, package-vscode, publish-container, publish-cargo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Enterprise Toolchains
        uses: self:gt-dev/actions/setup-toolchains@v1
        with:
          bun: "true"

      - name: Download All Build Artifacts
        uses: self:gt-dev/actions/download-artifact@v1
        with:
          path: ./downloaded-artifacts

      - name: Collect Assets & Generate SHA256 Checksums
        run: |
          mkdir -p ./dist-release
          find ./downloaded-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.vsix" \) -exec cp {} ./dist-release/ \;
          cd ./dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Rich MCP Release Notes
        id: release_meta
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_HOST: ${{ vars.GITEA_HOST }}
          GITEA_REPO: ${{ github.repository }}
          PACKAGE_PUBLISHER: ${{ vars.PUBLISHER || github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v$(bun scripts/version.ts --get-current)"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          bun scripts/publish-release.ts --tag "${TAG_NAME}" --write-notes ./release-notes.md

      - name: Publish Binary-Whitelisted Gitea Release (SSoT)
        uses: self:gt-dev/actions/publish-release@v1
        with:
          tag: ${{ steps.release_meta.outputs.tag_name }}
          app: cddm
          artifacts-dir: dist-release
          body-file: ./release-notes.md
          strict-whitelist: "true"
          verify-urls: "true"
          dispatch-homebrew: "false"
          dispatch-scoop: "false"
          dispatch-winget: "false"
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Dispatch Multi-Binary Package Manifests via Least-Privilege Deploy Keys
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_HOST: ${{ vars.GITEA_HOST }}
          GITEA_REPO: ${{ github.repository }}
          PACKAGE_PUBLISHER: ${{ vars.PUBLISHER || github.repository_owner }}
          PACKAGE_PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
          WINGET_REPO: ${{ vars.WINGET_REPO }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          WINGET_DEPLOY_KEY: ${{ secrets.WINGET_DEPLOY_KEY }}
          GITEA_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/dispatch-distribution.ts --package cddm --tag "${{ steps.release_meta.outputs.tag_name }}" --dist-dir "dist-release"
