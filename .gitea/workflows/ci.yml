name: Gitea Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

jobs:
  rust-ci:
    name: Rust Quality Gate & Strict Dogfooding
    runs-on: highperf
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Verify Rust Formatting (cargo fmt --check)
        run: cargo fmt --check

      - name: Ensure Embedded WebUI Assets Placeholder
        run: |
          mkdir -p webui/dist
          test -f webui/dist/index.html || echo '<!DOCTYPE html><html><head><title>CDDM</title></head><body><div id="root"></div></body></html>' > webui/dist/index.html

      - name: Cargo Typecheck (cargo check --all-targets)
        run: cargo check --workspace --all-targets

      - name: Clippy Zero-Warning Linter (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit & Integration Tests (cargo test)
        run: cargo test --workspace

      - name: Build Release Binaries (cddm, cddm-mcp, cddm-lsp)
        run: cargo build --release -p cddm-cli --bin cddm -p cddm-mcp --bin cddm-mcp -p cddm-lsp --bin cddm-lsp

      - name: CDDM Strict Dogfooding Quality Gate (<= 5.0% Fail Threshold)
        run: ./target/release/cddm scan . --min-tokens 50 --fail-threshold 5.0

      - name: Upload Prebuilt Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: cddm-prebuilt-binaries
          path: |
            target/release/cddm
            target/release/cddm-mcp
            target/release/cddm-lsp

  webui-ci:
    name: WebUI Frontend & E2E Acceptance Gate
    needs: [rust-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Prebuilt Binaries
        uses: actions/download-artifact@v4
        with:
          name: cddm-prebuilt-binaries
          path: target/release

      - name: Ensure Binaries Executable
        run: chmod +x target/release/cddm target/release/cddm-mcp target/release/cddm-lsp

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui

      - name: Typecheck TypeScript (tsc -b)
        working-directory: ./webui
        run: bun run check

      - name: Code Formatting Check (vp fmt --check)
        working-directory: ./webui
        run: bun run format:check

      - name: WebUI Linter (vp lint)
        working-directory: ./webui
        run: bun run lint

      - name: Run WebUI Vitest Suite (vitest run)
        working-directory: ./webui
        run: bun run test

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Browser Test Suite
        run: bun run test:e2e

      - name: Build WebUI Bundle (vp build)
        working-directory: ./webui
        run: bun run build

  workspace-governance-ci:
    name: Workspace Standards & MCP Protocol Gate
    needs: [rust-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Prebuilt Binaries
        uses: actions/download-artifact@v4
        with:
          name: cddm-prebuilt-binaries
          path: target/release

      - name: Ensure Binaries Executable
        run: chmod +x target/release/cddm target/release/cddm-mcp target/release/cddm-lsp

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui
          bun install --cwd editors/vscode

      - name: Validate Formatting, Lints & TypeScript (vp check)
        run: bunx vp check

      - name: Run Script Test Suites (bun test)
        run: bun test --timeout 60000 scripts/tests scripts/lib

      - name: Run MCP Protocol Per-Tool Test Suites (bun test)
        run: bun test --timeout 60000 tests/mcp

      - name: Validate 4-Pillar Feature Parity
        run: bun scripts/check-feature-parity.ts

      - name: Validate File Length Limits (<= 500 lines)
        run: bun scripts/check-file-length.ts

      - name: Validate Zero-Emoji Policy
        run: bun scripts/check-no-emojis.ts

      - name: Validate Documentation Integrity & Synchronization
        run: bun scripts/check-docs.ts

      - name: Validate Milestone Governance Compliance
        run: bun scripts/check-milestones.ts

  container-ci:
    name: Build & Push Container to Private VCS Registry
    needs: [rust-ci, webui-ci, workspace-governance-ci]
    runs-on: highperf
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Private Gitea Container Registry
        run: |
          echo "${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}" | docker login git.gt-web-dev.com -u "${{ github.actor }}" --password-stdin

      - name: Build and Push CDDM Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            git.gt-web-dev.com/gt-dev/cddm:latest
            git.gt-web-dev.com/gt-dev/cddm:${{ github.sha }}
          cache-from: type=registry,ref=git.gt-web-dev.com/gt-dev/cddm:buildcache
          cache-to: type=inline

      - name: Verify Container Execution from Private Registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull git.gt-web-dev.com/gt-dev/cddm:latest
          docker run --rm git.gt-web-dev.com/gt-dev/cddm:latest --version
