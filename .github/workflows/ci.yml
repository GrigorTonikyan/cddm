name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Verify Rust Formatting
        run: cargo fmt --check

      - name: Ensure Embedded WebUI Assets Placeholder
        run: |
          mkdir -p webui/dist
          test -f webui/dist/index.html || echo '<!DOCTYPE html><html><head><title>CDDM</title></head><body><div id="root"></div></body></html>' > webui/dist/index.html

      - name: Cargo Typecheck
        run: cargo check --workspace --all-targets

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --workspace

      - name: CDDM Dogfooding Self-Scan (Mandatory Quality Gate)
        run: cargo run -p cddm-cli -- scan . --min-tokens 50 --fail-threshold 15.0

  webui-ci:
    name: WebUI Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui

      - name: Typecheck TypeScript (tsc -b)
        working-directory: ./webui
        run: bun run check

      - name: Code Formatting Check (vp fmt --check)
        working-directory: ./webui
        run: bun run format:check

      - name: WebUI Linter (vp lint)
        working-directory: ./webui
        run: bun run lint

      - name: Run WebUI Vitest Suite (vitest run)
        working-directory: ./webui
        run: bun run test

      - name: Build WebUI Bundle (vp build)
        working-directory: ./webui
        run: bun run build

  workspace-governance-ci:
    name: Workspace Standards & MCP Protocol Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Build MCP Server Binary
        run: cargo build -p cddm-mcp

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd webui
          bun install --cwd editors/vscode

      - name: Validate Workspace Formatting, Lints & Types (vp check)
        run: bunx vp check

      - name: Run Script Test Suites (bun test)
        run: bun test --timeout 30000 scripts/tests scripts/lib

      - name: Run MCP Protocol Per-Tool Test Suites (bun test)
        run: bun test --timeout 30000 tests/mcp

      - name: Validate 4-Pillar Feature Parity
        run: bun scripts/check-feature-parity.ts

      - name: Validate File Length Limits (<= 500 lines)
        run: bun scripts/check-file-length.ts

      - name: Validate Zero-Emoji Policy
        run: bun scripts/check-no-emojis.ts

      - name: Validate Documentation Integrity & Synchronization
        run: bun scripts/check-docs.ts
