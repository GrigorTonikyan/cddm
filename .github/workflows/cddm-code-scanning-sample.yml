name: CDDM Code Scanning & SARIF Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cddm-scan:
    name: Duplicate Code Analysis & SARIF Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run CDDM Duplication Scan & SARIF Export
        id: cddm
        uses: ./.github/actions/cddm-scan
        with:
          directory: "."
          min-tokens: "50"
          fail-threshold: "15.0"
          format: "sarif"
          sarif-file: "cddm-results.sarif"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: "cddm-results.sarif"
          category: "cddm-clone-detection"
