name: CDDM Code Scanning & SARIF Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  cddm-scan:
    name: Duplicate Code Analysis & SARIF Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run CDDM Duplication Scan & SARIF Export
        id: cddm
        uses: ./.github/actions/cddm-scan
        with:
          directory: "."
          min-tokens: "50"
          fail-threshold: "15.0"
          format: "sarif"
          sarif-file: "cddm-results.sarif"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "cddm-results.sarif"
          category: "cddm-clone-detection"
