name: Release & Package Publishing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: cddm-windows-amd64.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: cddm-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: cddm-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: cddm-darwin-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun & Build WebUI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build WebUI Bundle
        run: |
          cd webui
          bun install
          bun run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary Target
        run: cargo build --release --target ${{ matrix.target }} --bin cddm

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/cddm*

  github-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/**/*
          generate_release_notes: true
