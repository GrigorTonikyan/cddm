[workspace]
resolver = "2"
members = ["crates/cddm-cli", "crates/cddm-core", "crates/cddm-mcp"]

[workspace.package]
version = "0.3.0"
edition = "2024"
documentation = "https://docs.rs/cddm-core"
readme = "README.md"
homepage = "https://github.com/GrigorTonikyan/cddm"
repository = "https://github.com/GrigorTonikyan/cddm"
license = "MIT OR Apache-2.0"
keywords = ["ast", "code-quality", "duplication", "mcp", "tree-sitter"]
categories = ["code-analysis", "command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "^1"
async-trait = "^0.1"
axum = "^0.8"
blake3 = "^1"
chrono = { version = "^0.4", features = ["serde"] }
clap = { version = "^4", features = ["derive", "env"] }
comfy-table = "^8"
gix = "^0.87"
ignore = "^0.4"
mime_guess = "^2"
notify = "^8"
opener = "^0.8"
rayon = "^1"
rust-embed = { version = "^8", features = ["axum"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha2 = "^0.11"
thiserror = "^2"
tokio = { version = "^1", features = ["full"] }
tower-http = { version = "^0.7", features = ["cors", "fs"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
tree-sitter = "^0.26"
tree-sitter-javascript = "^0.25"
tree-sitter-python = "^0.25"
tree-sitter-rust = "^0.24"
tree-sitter-typescript = "^0.23"
uuid = { version = "^1", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"
