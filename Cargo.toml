[workspace]
resolver = "2"
members = [
    "crates/cddm-core",
    "crates/cddm-cli",
    "crates/cddm-mcp",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Grigor Tonikyan <grigor@tonikyan.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrigorTonikyan/cddm"
homepage = "https://github.com/GrigorTonikyan/cddm"
documentation = "https://docs.rs/cddm-core"
readme = "README.md"
keywords = ["code-quality", "duplication", "ast", "tree-sitter", "mcp"]
categories = ["development-tools", "command-line-utilities", "code-analysis"]


[workspace.dependencies]
anyhow = "^1"
async-trait = "^0.1"
axum = "^0.8"
blake3 = "^1"
chrono = { version = "^0.4", features = ["serde"] }
clap = { version = "^4", features = ["derive", "env"] }
comfy-table = "^8"
gix = "^0.86"
ignore = "^0.4"
mime_guess = "^2"
notify = "^8"
opener = "^0.8"
rayon = "^1"
rust-embed = { version = "^8", features = ["axum"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha2 = "^0.10"
thiserror = "^2"
tokio = { version = "^1", features = ["full"] }
tower-http = { version = "^0.7", features = ["fs", "cors"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tracing = "^0.1"
tracing-subscriber = "^0.3"
uuid = { version = "^1", features = ["serde", "v4"] }
